name: Senaeya
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.5+1

environment:
  sdk: ">=3.4.0-0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
 
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.0
  image_picker: ^1.1.2
  pin_code_fields: ^8.0.1
  flutter_svg:
  internet_connection_checker: ^3.0.1
  flutter_spinkit: ^5.2.0
  socket_io_client: ^2.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  package_info_plus:
  connectivity_plus: ^6.1.5
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  http: ^1.2.1
  mime: ^1.0.5
  get: ^4.7.2
  auto_size_text: ^3.0.0
  permission_handler: ^11.3.1
  local_auth: ^2.1.7
  syncfusion_flutter_pdfviewer:
  dio: ^5.4.0
  logger: ^2.0.2
  path_provider: ^2.1.2
  device_info_plus: ^11.5.0

  flutter_localizations:
    sdk: flutter
  share_plus:
  intl_phone_field: ^3.2.0
  mobile_scanner: ^7.1.3
  moyasar: ^3.0.3
  device_preview:
  clipboard: ^2.0.2
  flutter_widget_from_html: ^0.17.1
  geolocator: ^14.0.1
  google_maps_flutter: ^2.13.1
  webview_flutter: ^4.13.0
  pretty_qr_code: ^3.5.0
  pdf: ^3.11.3
  #path_provider: ^2.1.1
  open_file: ^3.3.2
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  awesome_snackbar_content: ^0.1.8
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^18.0.1
  change_app_package_name: ^1.5.0
  rename_app: ^1.6.5
  flutter_scalable_ocr: ^2.2.1


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/app_logo.png"
  min_sdk_android: 23
  remove_alpha_ios: true




dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/logo/
    - assets/images/
    - assets/icons/
    - assets/dev_image/

  fonts:
    - family: Calibri
      fonts:
        - asset: lib/core/font/calibri-bold.ttf
        - asset: lib/core/font/calibri-bold-italic.ttf
        - asset: lib/core/font/calibri-italic.ttf
        - asset: lib/core/font/calibri-regular.ttf
    - family: Helvetica
      fonts:
        - asset: lib/core/font/Helvetica-Bold.ttf
        - asset: lib/core/font/Helvetica.ttf
        - asset: lib/core/font/Helvetica-BoldOblique.ttf
        - asset: lib/core/font/helvetica-compressed-5871d14b6903a.otf
        - asset: lib/core/font/helvetica-light-587ebe5a59211.ttf
        - asset: lib/core/font/Helvetica-Oblique.ttf
        - asset: lib/core/font/helvetica-rounded-bold-5871d05ead8de.otf

    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
